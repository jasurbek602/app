name: Android APK yig'ish

"on":
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JDK o'rnatish (Android build uchun shart)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Loyiha bog'liqliklarini o'rnatish
        run: npm install

      - name: Capacitor o'rnatish
        run: npm install @capacitor/core @capacitor/android && npm install -D @capacitor/cli

      - name: Android platformasini yaratish
        run: npx cap add android

      - name: Kotlin stdlib "duplicate class" muammosini tuzatish
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Web fayllarni Android loyihasiga sinxronlash
        run: npx cap sync android

      - name: FLAG_SECURE (skrinshot/ekran yozuvini bloklash) qo'shish
        run: |
          MAIN_ACTIVITY=$(find android -name MainActivity.java | head -1)
          echo "Topildi: $MAIN_ACTIVITY"
          cp android-native-reference/MainActivity.java "$MAIN_ACTIVITY"

      - name: Gradle bilan APK yig'ish (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK'ni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: chemchat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
